<style>
  :root {
    color-scheme: light;
    --bg: #edf1ed;
    --surface: #f9fbf8;
    --surface-2: #e4eae4;
    --ink: #101c17;
    --ink-2: #435249;
    --ink-3: #5c6b63;
    --line: #d2dbd3;
    --line-strong: #a9b7ad;
    --jade: #0e6b4d;
    --jade-soft: #d3eadf;
    --red: #b8351f;
    --red-soft: #f6dcd6;
    --focus: #0e6b4d;
    --on-jade: #ffffff;

    --tile-face: #fbf8ee;
    --tile-ink: #1a231e;
    --tile-edge: #1f7a5a;
    --tile-shadow: rgba(16, 28, 23, .22);

    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --s-other: #7d8a83;

    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cjk: "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b1511;
      --surface: #12211a;
      --surface-2: #1a2d24;
      --ink: #eaf2ed;
      --ink-2: #b7c8bd;
      --ink-3: #93a59a;
      --line: #263a30;
      --line-strong: #47604f;
      --jade: #4cc79a;
      --jade-soft: #173a2b;
      --red: #ff8168;
      --red-soft: #3d201b;
      --focus: #4cc79a;
      --on-jade: #06231a;
      --tile-shadow: rgba(0, 0, 0, .5);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --s-other: #8a988f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1511;
    --surface: #12211a;
    --surface-2: #1a2d24;
    --ink: #eaf2ed;
    --ink-2: #b7c8bd;
    --ink-3: #93a59a;
    --line: #263a30;
    --line-strong: #47604f;
    --jade: #4cc79a;
    --jade-soft: #173a2b;
    --red: #ff8168;
    --red-soft: #3d201b;
    --focus: #4cc79a;
      --on-jade: #06231a;
    --tile-shadow: rgba(0, 0, 0, .5);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --s-other: #8a988f;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .page { max-width: 1040px; margin: 0 auto; padding: 28px 16px 56px; display: grid; gap: 28px; }
  @media (min-width: 720px) { .page { padding: 44px 24px 72px; gap: 36px; } }

  /* ---------- tiles (the recurring motif) ---------- */
  .tile {
    display: inline-grid; place-items: center; flex: none;
    width: 30px; height: 38px; margin-bottom: 4px;
    border-radius: 6px;
    background: var(--tile-face); color: var(--tile-ink);
    font: 700 18px/1 var(--display);
    box-shadow: 0 4px 0 var(--tile-edge), 0 6px 8px var(--tile-shadow), inset 0 0 0 1px rgba(0,0,0,.07);
    font-variant-numeric: tabular-nums;
  }
  .tile.first { color: #c23b26; }
  .tile-lg { width: 46px; height: 58px; border-radius: 8px; box-shadow: 0 5px 0 var(--tile-edge), 0 8px 12px var(--tile-shadow), inset 0 0 0 1px rgba(0,0,0,.07); }
  .cjk { font-family: var(--cjk); font-weight: 700; color: #c23b26; font-size: 32px; line-height: 1; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 20px; }
  h1 {
    margin: 0; font: 800 clamp(30px, 6vw, 48px)/1.05 var(--display);
    letter-spacing: -.02em; text-wrap: balance;
  }
  .meta { margin: 6px 0 0; color: var(--ink-2); }
  .status { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .status.live .dot { background: var(--jade); }
  .status.warn .dot { background: var(--red); }


  .fact .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .fact .v { font: 700 20px/1.25 var(--display); letter-spacing: -.01em; }
  .fact .n { font-size: 13px; color: var(--ink-2); }

  /* ---------- panels ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .panel-head { padding: 18px 18px 6px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  @media (min-width: 720px) { .panel-head { padding: 22px 24px 8px; } }
  h2 { margin: 0; font: 700 22px/1.2 var(--display); letter-spacing: -.01em; }
  .hint { margin: 0; font-size: 13px; color: var(--ink-3); }
  .flat h2 { margin-bottom: 4px; }

  /* ---------- leaderboard ---------- */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  #board > thead > tr > th, #board > tbody > tr.row > td { padding: 12px 8px; text-align: right; white-space: nowrap; }
  #board > thead > tr > th:first-child, #board > tbody > tr.row > td:first-child { padding-left: 16px; text-align: left; width: 1%; }
  #board > thead > tr > th:last-child, #board > tbody > tr.row > td:last-child { padding-right: 16px; }
  @media (min-width: 720px) {
    #board > thead > tr > th:first-child, #board > tbody > tr.row > td:first-child { padding-left: 24px; }
    #board > thead > tr > th:last-child, #board > tbody > tr.row > td:last-child { padding-right: 24px; }
    #board > thead > tr > th, #board > tbody > tr.row > td { padding-inline: 12px; }
  }
  #board > thead > tr > th.name, #board > tbody > tr.row > td.name { text-align: left; }
  #board > thead > tr > th { padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .sort { background: none; border: 0; padding: 4px 2px; cursor: pointer; letter-spacing: inherit; text-transform: inherit; font-weight: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .sort:hover { color: var(--ink); }
  .sort .arrow { width: 8px; opacity: 0; font-size: 9px; }
  th[aria-sort] .sort { color: var(--ink); }
  th[aria-sort] .arrow { opacity: 1; }
  #board tbody tr.row { cursor: pointer; }
  #board tbody tr.row td { border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #board tbody tr.row:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  #board tbody tr.row.open td { border-bottom-color: transparent; background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  .who { display: flex; align-items: center; gap: 12px; }
  .pname { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; font-size: 16px; display: block; }
  .sub { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; min-height: 0; }
  .sub:empty { display: none; }
  .sub-m { display: none; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line-strong); color: var(--ink-2); border-radius: 999px; padding: 0 7px; line-height: 17px; }
  .rate { display: inline-flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .rate .num { font: 700 19px/1 var(--display); min-width: 4.4ch; text-align: right; }
  .bar { position: relative; width: 104px; height: 6px; border-radius: 3px; background: var(--surface-2); }
  .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
  .bar i { position: absolute; top: 0; bottom: 0; }
  .bar i.up { background: var(--jade); border-radius: 0 3px 3px 0; }
  .bar i.down { background: var(--red); border-radius: 3px 0 0 3px; }
  .best { display: inline-block; padding: 1px 8px; margin-right: -8px; border-radius: 999px; background: var(--jade-soft); color: var(--jade); font-weight: 700; }
  .luck { display: inline-flex; gap: 5px; align-items: center; font-weight: 600; }
  .luck.pos { color: var(--jade); }
  .luck.neg { color: var(--red); }
  .luck.zero { color: var(--ink-3); }
  .luck .ar { font-size: 9px; }
  .muted { color: var(--ink-2); }
  #dataNote:empty { display: none; }
  .sub { flex-wrap: wrap; }
  @media (max-width: 719px) {
    .c-g, .c-w, .c-exp, .bar { display: none; }
    #board > tbody > tr.row > td.name { white-space: normal; }
    .sub-m { display: inline; }
    .rate .num { font-size: 18px; }
    .who { gap: 10px; }
    .best { margin-right: 0; }
  }
  @media (max-width: 460px) { .c-luck { display: none; } }

  tr.detail > td { padding: 0 !important; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface-2) 55%, transparent); text-align: left !important; white-space: normal !important; }
  .dgrid { display: grid; gap: 22px; padding: 6px 16px 22px; }
  @media (min-width: 720px) { .dgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); padding: 8px 24px 26px; gap: 32px; } }
  .dgrid h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pips { display: flex; gap: 5px; flex-wrap: wrap; }
  .pip { width: 22px; height: 28px; border-radius: 4px; display: grid; place-items: center; font: 700 11px/1 var(--body); background: var(--surface); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .pip.w { background: var(--jade); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  :root[data-theme="dark"] .pip.w { color: #06231a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pip.w { color: #06231a; } }
  .dl { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; }
  .dl dt { color: var(--ink-2); }
  .dl dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .h2h th, .h2h td { padding: 6px 0; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
  .h2h th:first-child, .h2h td:first-child { text-align: left; }
  .h2h thead th { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  .h2h tbody td { border-bottom: 1px solid var(--line); }
  .h2h tbody tr:last-child td { border-bottom: 0; }
  .h2h .lead { font-weight: 700; color: var(--jade); }
  .h2h-note { margin: -4px 0 10px; }
  .h2h th:not(:first-child), .h2h td:not(:first-child) { padding-left: 12px; }

  /* ---------- chart ---------- */
  .chart-body { padding: 8px 12px 18px; }
  @media (min-width: 720px) { .chart-body { padding: 8px 18px 22px; } }
  .chart-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: center; padding: 6px 6px 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px 5px 9px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
  .chip .key { width: 16px; height: 3px; border-radius: 2px; background: var(--c); }
  .chip[aria-pressed="false"] { color: var(--ink-3); border-style: dashed; background: transparent; }
  .chip[aria-pressed="false"] .key { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-3); height: 3px; }
  .chip:hover { background: var(--surface-2); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 5px 13px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  #chartwrap { position: relative; }
  #chart { display: block; width: 100%; touch-action: pan-y; }
  #chart:focus-visible { outline-offset: 0; }
  #chart text { font: 11.5px var(--body); fill: var(--ink-3); }
  #chart .grid { stroke: var(--line); stroke-width: 1; }
  #chart .ref { stroke: var(--line-strong); stroke-width: 1; }
  #chart .day { stroke: var(--line); stroke-width: 1; }
  #chart .cross { stroke: var(--ink-3); stroke-width: 1; }
  #chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; transition: opacity .12s; }
  #chart .dim { opacity: .16; }
  .tip { position: absolute; top: 12px; z-index: 2; pointer-events: none; min-width: 168px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 8px 24px var(--tile-shadow); font-size: 13px; }
  .tip .th { font-weight: 600; margin-bottom: 1px; }
  .tip .ts { color: var(--ink-3); font-size: 12px; margin-bottom: 7px; }
  .tip .tr { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 1.5px 0; }
  .tip .tk { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
  .tip .tr b { font-variant-numeric: tabular-nums; font-size: 14px; }
  .tip .tr span:nth-child(2) { color: var(--ink-2); }
  .tip .tr.won span:nth-child(2) { color: var(--ink); font-weight: 600; }
  .mini th, .mini td { padding: 7px 10px; text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .mini th:first-child, .mini td:first-child, .mini th:nth-child(2), .mini td:nth-child(2) { text-align: left; }
  .mini thead th { position: sticky; top: 0; background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .mini .key { display: inline-block; width: 10px; height: 3px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
  .tscroll { max-height: 420px; overflow: auto; }

  /* ---------- recent games ---------- */
  .games { margin-top: 8px; border-top: 1px solid var(--line); }
  .g { display: grid; grid-template-columns: 44px 62px minmax(0, 1fr); gap: 4px 12px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .g .gid { font-weight: 700; font-variant-numeric: tabular-nums; }
  .g .gd { color: var(--ink-3); font-size: 13.5px; }
  .g .gw { font-weight: 600; }
  .g .gw .win { color: var(--jade); }
  .g .gp { color: var(--ink-2); font-size: 13.5px; grid-column: 3; }
  @media (min-width: 720px) {
    .g { grid-template-columns: 52px 70px 200px minmax(0, 1fr); }
    .g .gp { grid-column: auto; }
  }
  .more { margin-top: 14px; background: none; border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  .more:hover { background: var(--surface-2); }

  /* ---------- explainer ---------- */
  details.how { border-top: 1px solid var(--line); padding-top: 18px; }
  details.how summary { cursor: pointer; font: 700 22px/1.2 var(--display); letter-spacing: -.01em; }
  details.how .txt { max-width: 68ch; margin-top: 14px; color: var(--ink-2); display: grid; gap: 12px; }
  details.how .txt p { margin: 0; }
  details.how .txt b { color: var(--ink); }
  details.how .txt { max-width: 74ch; gap: 14px; line-height: 1.6; }
  details.how .txt h3 { margin: 14px 0 -4px; font: 700 18px/1.3 var(--display); letter-spacing: -.005em; color: var(--ink); }
  details.how .txt ul, details.how .txt ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
  .formula { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; overflow-x: auto; }
  .eq { display: flex; align-items: center; gap: 10px; font: 600 clamp(17px, 3.8vw, 22px)/1.2 var(--display); color: var(--ink); white-space: nowrap; }
  .eq .v { font-style: italic; }
  .eq .v.avg { text-decoration: overline; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; }
  .frac > span:first-child { padding: 0 8px 4px; border-bottom: 1.5px solid var(--ink); }
  .frac > span:last-child { padding: 4px 8px 0; }
  .defs { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14.5px; line-height: 1.5; }
  .defs dt { font: italic 600 16px/1.4 var(--display); color: var(--ink); text-align: center; min-width: 1.6ch; }
  .defs dt.avg span { text-decoration: overline; }
  .defs dd { margin: 0; }
  .ex { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .ex h4 { margin: 0; padding: 11px 16px; font: 600 15px/1.3 var(--body); color: var(--ink); background: var(--surface-2); }
  .ex .row { display: grid; gap: 1px; padding: 10px 16px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ex .row:nth-child(2) { border-top: 0; }
  .ex .lbl { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .ex .val { color: var(--ink); }
  .ex .row.result .val { color: var(--jade); font-weight: 700; }
  .ex .row.aside .val { color: var(--ink-2); }
  .weights { display: flex; flex-wrap: wrap; gap: 8px; }
  .weights span { border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 11px; font-size: 13.5px; color: var(--ink-2); }
  .weights b { font-variant-numeric: tabular-nums; }
  .foot { color: var(--ink-3); font-size: 13px; }
  .note { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--red-soft); color: var(--ink); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ================= demo additions ================= */
  .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: var(--jade); color: var(--on-jade); font-weight: 600; text-decoration: none; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }

  .linkbtn { background: none; border: 0; padding: 0 2px; color: var(--jade); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .status .linkbtn { margin-left: 2px; }

  /* filters: one row above everything they scope */
  .toolbar { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 28px; }
  .fld { display: grid; gap: 5px; }
  .fld > span { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  select {
    font: inherit; color: var(--ink); background-color: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 34px 7px 12px; min-width: 170px;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
    background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    cursor: pointer;
  }
  .scope { margin: 0; flex: 1 1 260px; align-self: center; font-size: 13.5px; color: var(--ink-2); }

  /* facts: 2 columns on phones, 3 on desktop, borders per cell so a short last row stays tidy */
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .fact { padding: 14px 12px 14px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
  .fact:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
  .fact .v { font-size: 17px; }
  @media (min-width: 720px) {
    .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .fact, .fact:nth-child(even) { padding: 16px 20px; border-left: 1px solid var(--line); }
    .fact:nth-child(3n+1) { padding-left: 0; border-left: 0; }
    .fact .v { font-size: 20px; }
  }

  /* rating change since previous game night */
  .chg { display: inline-block; min-width: 4.6ch; text-align: right; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-3); }
  .chg.up { color: var(--jade); }
  .chg.down { color: var(--red); }
  .emptyrow td, .empty { padding: 28px 16px; text-align: center; color: var(--ink-3); }

  /* game log */
  .flat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .nt { display: grid; gap: 6px 16px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .nt .nd { font-weight: 700; }
  .nt .ns { color: var(--ink-3); font-size: 13.5px; }
  .wins { display: flex; flex-wrap: wrap; gap: 6px; }
  .wins span { font-size: 13.5px; padding: 1px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .wins span.mvp { background: var(--jade-soft); color: var(--jade); font-weight: 700; }
  @media (min-width: 720px) { .nt { grid-template-columns: 140px 150px minmax(0, 1fr); } }
  .more.small { margin-top: 0; padding: 5px 11px; font-size: 13.5px; }

  /* head-to-head grid */
  .mscroll { overflow-x: auto; padding: 4px 14px 18px; }
  .mx { width: auto; min-width: 100%; border-collapse: separate; border-spacing: 3px; }
  .mx th, .mx td { padding: 9px 8px; text-align: center; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; border-radius: 6px; }
  .mx thead th { font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--ink-3); }
  .mx tbody th { text-align: left; font-weight: 600; padding-left: 10px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .mx td { background: var(--surface-2); color: var(--ink); }
  .mx td.self { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .mx td.none { background: transparent; color: var(--ink-3); }

  /* player detail extras */
  .more.copy { margin-top: 14px; }

  .toolbar .seg button { padding: 8px 14px; }

  @media (max-width: 719px) {
    .chg { min-width: 3.3ch; font-size: 12px; }
    #board > thead > tr > th:not(:first-child):not(:last-child),
    #board > tbody > tr.row > td:not(:first-child):not(:last-child) { padding-inline: 5px; }
    .rate { gap: 6px; }
    .status { flex-wrap: wrap; }
  }


  /* phone polish (kept last so it wins over earlier rules) */
  .only-m { display: none; }
  .sort { padding: 8px 2px; }
  .linkbtn { padding: 6px 4px; }
  @media (max-width: 719px) { .only-m { display: inline; } .toolbar { gap: 14px 16px; } }
  @media (max-width: 480px) { .eq { font-size: 13.5px; gap: 6px; } .formula { padding: 16px 14px; } }

<noscript><p style="padding:16px">This page needs JavaScript to show the leaderboard.</p></noscript>
<div class="page">

      </div>
    </div>

      </div>
    </div>

  <div class="facts" id="facts"></div>

  <section class="panel" aria-labelledby="h-chart">

        </div>
      </div>

        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="tscroll" id="tscroll" hidden></div>
    </div>
  </section>

  <section class="flat" aria-labelledby="h-log">

      <h2 id="h-log">Game log</h2>
      <div class="seg" role="group" aria-label="Group games by">
        <button type="button" id="lNights" aria-pressed="true">By night</button>
        <button type="button" id="lGames" aria-pressed="false">By game</button>
      </div>
    </div>
    <div class="games" id="log"></div>
    <button type="button" class="more" id="moreLog" hidden></button>
  </section>

  <section class="panel" aria-labelledby="h-h2h">
    <div class="panel-head">
      <h2 id="h-h2h">Head to head</h2>
      <p class="hint">Row player's wins, then column player's wins, in games they both played. Green means the row player wins more often at those tables.<span class="only-m"> Scroll sideways to see every player.</span></p>
    </div>
    <div class="mscroll" id="matrix"></div>
  </section>

  <details class="how">
    <summary>How ratings work</summary>

  </details>

  <p class="foot" id="foot"></p>
</div>

<script src="config.js"></script>
<script src="snapshot.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var CFG = window.MAHJONG_CONFIG || {};
  var PRIOR = 10;            // imaginary games in the rating formula
  var PROVISIONAL = PRIOR;   // fewer games than this = provisional
  var MAX_SERIES = 8;
  var CACHE_KEY = "mahjong-leaderboard-cache-v1";
  var REFRESH_AFTER_MS = 5 * 60 * 1000;
  var ACTIVE_DAYS = 30;      // "active" = played within this many days of the latest game
  var ACTIVE_KEY = "mahjong-active-only";

  // ---------- tiny DOM helpers (text always goes through textContent) ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k === "style") el.style.cssText = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
    }
    return el;
  }
  var NS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    for (var k in attrs || {}) el.setAttribute(k, attrs[k]);
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  // ---------- formatting ----------
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function parseIso(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function isoOf(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function fmtDate(iso, withYear) {
    var d = parseIso(iso);
    return d ? MONTHS[d.getMonth()] + " " + d.getDate() + (withYear ? ", " + d.getFullYear() : "") : (iso || "");
  }
  function fmtDay(iso) { var d = parseIso(iso); return d ? WEEKDAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() : (iso || ""); }
  function fmtTime(d) { var hr = d.getHours(); return ((hr % 12) || 12) + ":" + ("0" + d.getMinutes()).slice(-2) + " " + (hr < 12 ? "AM" : "PM"); }
  function fmtStamp(d) { return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + fmtTime(d); }
  function pct(v) { return (v * 100).toFixed(1) + "%"; }
  function signed(v) { var r = Math.round(v * 1000) / 10; return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1); }
  function rnd(v) { return Math.round(v).toLocaleString("en-US"); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

  // ---------- data: parse the published Log CSV ----------
  function parseCsv(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = ""; rows.push(row); row = [];
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function toIso(v) {
    v = (v || "").trim();
    var m;
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v))) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v))) return m[3] + "-" + ("0" + m[1]).slice(-2) + "-" + ("0" + m[2]).slice(-2);
    var d = new Date(v);
    return isNaN(d) ? v : isoOf(d);
  }
  function parseLog(text) {
    var rows = parseCsv(text), hi = -1, i;
    for (i = 0; i < rows.length; i++) {
      if (rows[i].some(function (c) { return c.trim().toLowerCase() === "game id"; })) { hi = i; break; }
    }
    if (hi < 0) throw new Error("No 'Game ID' header found");
    var head = rows[hi].map(function (c) { return c.trim().toLowerCase(); });
    var col = { date: head.indexOf("date"), id: head.indexOf("game id"), player: head.indexOf("player"), result: head.indexOf("result") };
    if (col.id < 0 || col.player < 0 || col.result < 0) throw new Error("Log columns not found");
    var games = [], byId = {};
    for (i = hi + 1; i < rows.length; i++) {
      var r = rows[i], id = (r[col.id] || "").trim(), name = (r[col.player] || "").trim();
      if (!id || !name) continue;
      var g = byId[id];
      if (!g) { g = byId[id] = { id: id, date: col.date >= 0 ? toIso(r[col.date]) : "", players: [], winners: [] }; games.push(g); }
      g.players.push(name);
      if (/^win/i.test((r[col.result] || "").trim())) g.winners.push(name);
    }
    return { games: games };
  }

  // Games are ordered by Game ID number (G1, G2, ...), not row position, so a game that gets
  // rewritten lower down the Log after an edit keeps its place in the history.
  function sortGames(games) {
    var items = games.map(function (g, i) { var m = /(\d+)/.exec(g.id); return { g: g, i: i, n: m ? +m[1] : null }; });
    if (items.some(function (x) { return x.n == null; })) return games;
    items.sort(function (a, b) { return a.n - b.n || a.i - b.i; });
    return items.map(function (x) { return x.g; });
  }

  // ---------- model ----------
  function rate(w, g, base) { return 1000 + ((w + PRIOR * base) / (g + PRIOR) - base) * 2000; }

  // basis "table" (default): prior at each player's own expected win rate (table-size adjusted).
  // basis "group": prior at the group's overall win rate (matches the spreadsheet's Stats tab).
  function compute(games, basis, colorOrder) {
    var byName = {}, list = [], LW = 0, LG = 0, hist = [];
    games.forEach(function (gm) {
      gm.players.forEach(function (n) {
        if (!byName[n]) {
          byName[n] = { name: n, idx: list.length, cidx: colorOrder.indexOf(n), g: 0, w: 0, exp: 0, res: [], first: null, together: {} };
          list.push(byName[n]);
        }
      });
    });
    var nights = [], nightBy = {};
    games.forEach(function (gm, gi) {
      var night = nightBy[gm.date];
      if (!night) { night = nightBy[gm.date] = { date: gm.date, games: [], players: {}, wins: {} }; nights.push(night); }
      night.games.push(gm);
      gm.players.forEach(function (n) { night.players[n] = 1; });
      gm.winners.forEach(function (n) { night.wins[n] = (night.wins[n] || 0) + 1; });

      gm.players.forEach(function (n) {
        var p = byName[n], won = gm.winners.indexOf(n) >= 0;
        p.g++; p.exp += 1 / gm.players.length; p.res.push(won);
        if (p.first == null) p.first = gi;
        if (won) { p.w++; LW++; }
        LG++;
        gm.players.forEach(function (q) {
          if (q === n) return;
          var t = p.together[q] || (p.together[q] = { g: 0, mine: 0, theirs: 0 });
          t.g++; if (won) t.mine++; if (gm.winners.indexOf(q) >= 0) t.theirs++;
        });
      });
      var b = LG ? LW / LG : 0;
      hist.push(list.map(function (p) { return p.g ? rate(p.w, p.g, basis === "table" ? p.exp / p.g : b) : null; }));
    });
    nights.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var base = LG ? LW / LG : 0;
    list.forEach(function (p) {
      p.wr = p.g ? p.w / p.g : 0;
      p.expR = p.g ? p.exp / p.g : 0;
      p.luck = p.wr - p.expR;
      p.base = basis === "table" ? p.expR : base;
      p.rating = rate(p.w, p.g, p.base);
      var bw = 0, rw = 0, bl = 0, rl = 0;
      p.res.forEach(function (x) {
        rw = x ? rw + 1 : 0; rl = x ? 0 : rl + 1;
        if (rw > bw) bw = rw; if (rl > bl) bl = rl;
      });
      p.bestWin = bw; p.curWin = rw; p.bestLoss = bl; p.curLoss = rl;
    });
    var ranked = list.slice().sort(function (a, b) { return b.rating - a.rating || b.g - a.g; });
    ranked.forEach(function (p, i) { p.rank = i + 1; });
    var bestWr = -1;
    list.forEach(function (p) { if (p.g && p.wr > bestWr) bestWr = p.wr; });

    // change since the end of the previous game night
    var prevEnd = -1, prevDate = null;
    if (nights.length >= 2) {
      var lastDate = nights[nights.length - 1].date;
      for (var i = games.length - 1; i >= 0; i--) { if (games[i].date < lastDate) { prevEnd = i; prevDate = games[i].date; break; } }
    }
    list.forEach(function (p) {
      var a = prevEnd >= 0 ? hist[prevEnd][p.idx] : null, z = hist.length ? hist[hist.length - 1][p.idx] : null;
      p.delta = a != null && z != null ? z - a : null;
    });
    return { games: games, players: list, byName: byName, hist: hist, base: base, LW: LW, LG: LG, bestWr: bestWr, nights: nights, prevEnd: prevEnd, prevDate: prevDate, basis: basis };
  }

  function colorVar(p) { return p.cidx >= 0 && p.cidx < MAX_SERIES ? "var(--s" + (p.cidx + 1) + ")" : "var(--s-other)"; }
  function shortName(p) {
    var first = p.name.split(/\s+/)[0];
    var clash = M.players.some(function (q) { return q !== p && q.name.split(/\s+/)[0] === first; });
    return clash ? p.name : first;
  }
  function names(list) { return list.map(shortName).join(", "); }

  // ---------- state ----------
  var ALL = [], ORDER = [], M = null, LAST = {}, ANCHOR = "", CUTOFF = "";
  var period = "all", basis = "table", activeOnly = false;
  var sortKey = "rating", sortDir = -1, openName = null;
  var hidden = {}, view = "chart", logView = "nights", showAllLog = false, hl = null;
  var src = "snapshot", stamp = null, busy = false, failed = false, lastLoadMs = 0, pendingScroll = false;

  // ---------- URL state (shareable links) ----------
  function readHash() {
    var out = {};
    (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      try { out[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1)); } catch (e) {}
    });
    return out;
  }
  function writeHash() {
    var parts = [];
    if (period !== "all") parts.push("period=" + encodeURIComponent(period));
    if (basis === "group") parts.push("rating=group");
    if (activeOnly) parts.push("active=1");
    if (openName) parts.push("player=" + encodeURIComponent(openName));
    try { history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname + location.search); } catch (e) {}
  }

  // ---------- period filter ----------
  function buildPeriods() {
    var sel = $("#period"); clear(sel);
    var opts = [["all", "All time"], ["30d", "Last 30 days"]], months = {};
    ALL.forEach(function (g) { var m = (g.date || "").slice(0, 7); if (/^\d{4}-\d{2}$/.test(m)) months[m] = 1; });
    Object.keys(months).sort().reverse().forEach(function (m) { opts.push([m, MONTHS_LONG[+m.slice(5) - 1] + " " + m.slice(0, 4)]); });
    opts.forEach(function (o) { sel.appendChild(h("option", { value: o[0], text: o[1] })); });
    if (!opts.some(function (o) { return o[0] === period; })) period = "all";
    sel.value = period;
  }
  function periodGames() {
    if (period === "all") return ALL;
    if (period === "30d") { var d = new Date(); d.setDate(d.getDate() - 30); var c = isoOf(d); return ALL.filter(function (g) { return g.date >= c; }); }
    return ALL.filter(function (g) { return (g.date || "").slice(0, 7) === period; });
  }

  // ---------- header, status ----------
  function renderHeader() {
    var last = ALL.length ? ALL[ALL.length - 1].date : "";
    $("#meta").textContent = plural(ALL.length, "game") + " · " + plural(ORDER.length, "player") + (last ? " · last played " + fmtDate(last, true) : "");
    renderStatus();

    var bad = ALL.filter(function (g) { return g.winners.length !== 1; });
    var note = $("#dataNote"); clear(note);
    if (bad.length) {
      note.appendChild(h("p", { class: "note", text: "Check the sheet: " + bad.slice(0, 4).map(function (g) { return g.id + " has " + plural(g.winners.length, "winner"); }).join(", ") + (bad.length > 4 ? ", and " + (bad.length - 4) + " more" : "") + ". Each game should have exactly one." }));
    }
    var btn = $("#logBtn");
    if (CFG.formUrl) { btn.href = CFG.formUrl; btn.hidden = false; } else btn.hidden = true;
  }

  function renderStatus() {
    var st = $("#status"); clear(st);
    var cls = "status", msg;
    if (busy) msg = (src === "live" ? "Live from the sheet" : src === "cached" ? "Showing data from your last visit" : "Showing a saved copy") + " · updating…";
    else if (failed) { cls += " warn"; msg = src === "cached" && stamp ? "Couldn’t reach the sheet. Showing data from " + fmtStamp(stamp) : "Couldn’t reach the sheet, showing a saved copy"; }
    else if (src === "live") { cls += " live"; msg = "Live from the sheet · loaded " + fmtTime(stamp); }
    else msg = "Saved copy of the game log";
    st.className = cls;
    st.appendChild(h("span", { class: "dot" }));
    st.appendChild(h("span", { text: msg }));
    if (CFG.sheetCsvUrl && !busy) st.appendChild(h("button", { type: "button", class: "linkbtn", text: "Refresh", onclick: load }));
  }

  function renderToolbar() {
    $("#bGroup").setAttribute("aria-pressed", basis === "group");

          wins.appendChild(h("span", { class: mvp ? "mvp" : "", text: shortName(M.byName[nm]) + " " + n.wins[nm] + (mvp ? " · MVP" : "") }));
        });
        box.appendChild(h("div", { class: "nt" },
          h("span", { class: "nd", text: fmtDay(n.date) }),
          h("span", { class: "ns", text: plural(n.games.length, "game") + " · " + plural(Object.keys(n.players).length, "player") }),
          wins));
      });
      more.textContent = showAllLog ? "Show fewer" : "Show all " + total + " nights";
    } else {
      var all = M.games.slice().reverse();
      total = all.length; limit = 8;
      (showAllLog ? all : all.slice(0, limit)).forEach(function (g) {
        var others = g.players.filter(function (n) { return g.winners.indexOf(n) < 0; });
        box.appendChild(h("div", { class: "g" },
          h("span", { class: "gid", text: g.id }),
          h("span", { class: "gd", text: fmtDate(g.date) }),
          h("span", { class: "gw" }, h("span", { class: "win", text: g.winners.length ? g.winners.map(function (n) { return M.byName[n] ? M.byName[n].name : n; }).join(", ") : "No winner logged" }), g.winners.length ? " won" : ""),
          h("span", { class: "gp", text: g.players.length + "-player table · with " + others.map(function (n) { return shortName(M.byName[n]); }).join(", ") })));
      });
      more.textContent = showAllLog ? "Show fewer" : "Show all " + total + " games";
    }
    more.hidden = total <= limit;
  }

  // ---------- head-to-head grid ----------
  function renderMatrix() {
    var box = $("#matrix"); clear(box);
    var ps = M.shown.slice().sort(function (a, b) { return a.rank - b.rank; });
    if (ps.length < 2) { box.appendChild(h("p", { class: "empty", text: "This appears once two players have shared a game." })); return; }
    var head = h("tr", null, h("th", { scope: "col", "aria-label": "Player" }));
    ps.forEach(function (q) { head.appendChild(h("th", { scope: "col", text: shortName(q) })); });
    var tb = h("tbody");
    ps.forEach(function (a) {
      var tr = h("tr", null, h("th", { scope: "row", text: shortName(a) }));
      ps.forEach(function (b) {
        if (a === b) { tr.appendChild(h("td", { class: "self", "aria-hidden": "true" })); return; }
        var t = a.together[b.name];
        if (!t) { tr.appendChild(h("td", { class: "none", "aria-label": "Never at the same table", text: "–" })); return; }
        var v = (t.mine - t.theirs) / t.g, alpha = Math.min(0.34, Math.abs(v) * 1.1);
        var td = h("td", { title: a.name + " won " + t.mine + ", " + b.name + " won " + t.theirs + ", " + (t.g - t.mine - t.theirs) + " won by others, in " + t.g + " shared games", text: t.mine + "–" + t.theirs });
        if (v !== 0) td.style.background = "color-mix(in srgb, " + (v > 0 ? "var(--jade)" : "var(--red)") + " " + Math.round(alpha * 100) + "%, transparent)";
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    box.appendChild(h("table", { class: "mx" }, h("thead", null, head), tb));
  }

  // ---------- explainer ----------
  function renderHow() {
    var box = $("#how"); clear(box);
    var tm = basis === "table", b = M.base, grp = M.LG ? pct(b) : "n/a";

    function para(parts) {
      var el = h("p");
      parts.forEach(function (x) { el.appendChild(typeof x === "string" ? document.createTextNode(x) : Array.isArray(x) ? h("b", { text: x[0] }) : x); });
      box.appendChild(el);
    }
    function head(t) { box.appendChild(h("h3", { text: t })); }
    function list(tag, items) {
      var el = h(tag);
      items.forEach(function (parts) {
        var li = h("li");
        parts.forEach(function (x) { li.appendChild(typeof x === "string" ? document.createTextNode(x) : Array.isArray(x) ? h("b", { text: x[0] }) : x); });
        el.appendChild(li);
      });
      box.appendChild(el);
    }
    function v(t, cls) { return h("span", { class: "v" + (cls ? " " + cls : ""), text: t }); }

    if (!tm) para([["You’re viewing the group-average rating. "], "This is how the spreadsheet’s Stats tab calculates it. The site’s default is the table-adjusted rating, explained under “Table-adjusted rating” below. Switch back with the Rating toggle at the top."]);
    para(["Every game has one winner, and that is all the sheet records: no scores, no placements. So the rating is built from a single question: ",
      ["how often do you win, compared with " + (tm ? "what your table sizes predict?" : "the group?")],
      " The formula below answers it while stopping a few lucky (or unlucky) games from deciding the leaderboard."]);

    head("The formula");
    var eq = h("div", { class: "eq", "aria-label": "Rating equals 1000 plus, open parenthesis, W plus 10 times p, divided by N plus 10, minus p, close parenthesis, times 2000" },
      h("span", { text: "Rating" }), h("span", { text: "=" }), h("span", { text: "1000" }), h("span", { text: "+" }),
      h("span", { text: "(" }),
      h("span", { class: "frac" }, h("span", null, v("W"), " + 10 × ", v("p", "avg")), h("span", null, v("N"), " + 10")),
      h("span", { text: "−" }), v("p", "avg"),
      h("span", { text: ")" }), h("span", { text: "×" }), h("span", { text: "2000" }));
    var pDef = tm
      ? "The player’s own expected win rate: the average of 1 ÷ (players at the table) over the games they played, which is the Expected column. It replaces the group rate, so everyone is compared with their own fair share."
      : "The group’s win rate: everyone’s wins divided by everyone’s games played" + (M.LG ? " (" + M.LW + " ÷ " + M.LG + " = " + grp + " right now)" : "") + ". It counts every game equally, so a new player on a hot streak can’t skew it.";
    box.appendChild(h("div", { class: "formula" }, eq, h("dl", { class: "defs" },
      h("dt", null, v("W")), h("dd", { text: "Your wins." }),
      h("dt", null, v("N")), h("dd", { text: "Your games played." }),
      h("dt", { class: "avg" }, h("span", { text: "p" })), h("dd", { text: pDef }),
      h("dt", { text: "10" }), h("dd", { text: "The number of imaginary games added to everyone’s record (explained below)." }))));

    head("Step by step");
    list("ol", [
      [["Start with your record: "], "W wins in N games."],
      [["Add 10 imaginary games "], "in which you won at exactly " + (tm ? "your expected win rate" : "the group rate") + ". That adds 10 × p wins and 10 games, giving (W + 10p) ÷ (N + 10), your adjusted win rate."],
      [[tm ? "Compare with your fair share: " : "Compare with the group: "], "subtract p. Above zero means you win more often than " + (tm ? "your table sizes predict" : "the group average") + ", below zero less often."],
      [["Scale it: "], "multiply by 2000, so every percentage point of difference is worth 20 rating points."],
      [["Centre it: "], "add 1000, so a player who wins exactly at " + (tm ? "their expected rate" : "the group rate") + " sits at 1,000."]
    ]);

    if (M.LG) {
      head("Worked examples with the numbers on screen");
      var played = M.shown.filter(function (p) { return p.g; });
      var top = played.slice().sort(function (a, c) { return a.rank - c.rank; })[0];
      var few = played.filter(function (p) { return p !== top; }).sort(function (a, c) { return a.g - c.g || c.rank - a.rank; })[0];
      [top, few].forEach(function (p, i) {
        if (!p) return;
        var pb = p.base, adj = (p.w + PRIOR * pb) / (p.g + PRIOR), delta = Math.round((adj - pb) * 2000), raw = 1000 + (p.wr - pb) * 2000;
        var sign = delta >= 0 ? "+" : "−", mag = Math.abs(delta);
        function row(lbl, val, cls) { return h("div", { class: "row" + (cls ? " " + cls : "") }, h("span", { class: "lbl", text: lbl }), h("span", { class: "val", text: val })); }
        box.appendChild(h("div", { class: "ex" },
          h("h4", { text: p.name + (i === 0 ? " (top of the board)" : " (fewest games, shows the small-sample effect)") }),
          row("1. Record", plural(p.w, "win") + " in " + plural(p.g, "game") + " (" + pct(p.wr) + ")"),
          row("2. Add " + PRIOR + " imaginary games", "(" + p.w + " + " + PRIOR + " × " + pb.toFixed(3) + ") ÷ (" + p.g + " + " + PRIOR + ") = " + pct(adj)),
          row("3. Compare with " + (tm ? "their fair share" : "the group") + " (" + pct(pb) + ")", pct(adj) + " − " + pct(pb) + " = " + signed(adj - pb) + " points"),
          row("4. Scale and centre", "× 2000 = " + sign + mag + ", so 1,000 " + sign + " " + mag + " = " + rnd(p.rating), "result"),
          row("Without the adjustment", "The raw win rate alone would give " + rnd(raw) + ".", "aside")));
      });
    }

    head("Why not just rank by win rate?");
    para(["Because small samples lie. Someone who wins their first two games has a 100% win rate, and someone who has won 4 of 30 has 13%, but the first player has told us almost nothing. The 10 imaginary games act as a starting assumption that a new player is about average. Real results then pull the rating away from that assumption, slowly at first and then faster as evidence builds up. Statisticians call this a ",
      ["Bayesian average"], " (or shrinkage), and it is how sites rank movies that have only a few votes."]);
    para(["The weight your real record carries is N ÷ (N + 10), so it grows with every game:"]);
    var w = h("div", { class: "weights" });
    [5, 10, 20, 30, 60].forEach(function (n) { w.appendChild(h("span", null, n + " games: ", h("b", { text: Math.round(n / (n + PRIOR) * 100) + "%" }))); });
    box.appendChild(w);
    para(["At 10 games, your record and the starting assumption count equally. By 60 games your record is 86% of the rating, so the adjustment fades out on its own."]);

    head("Why not an Elo-style rating?");
    para(["Elo and similar systems update after each game based on who beat whom, and they need a result between specific opponents. Here a game is one winner among three to six players, with no scores or finishing order, so there is no head-to-head result to learn from. The only reliable signal is “won” or “didn’t win,” which is exactly what a win rate measures. This model also has an advantage: anyone can check their own rating with a calculator, and there is no hidden history to argue about."]);

    head("Why 1,000, 2,000 and 10?");
    para(["1,000 as the centre and 2,000 as the multiplier just make the number look like a familiar rating: 1,000 is par (you win exactly as often as expected), and 20 points equals one percentage point of win rate. The 10 imaginary games is a judgment call. It is large enough that one lucky night can’t put anyone at the top, and small enough that ratings mostly reflect real results after a few weeks of regular play. It can be changed if the group wants ratings to move faster or slower."]);

    head("Table-adjusted rating (the default)");
    para(["Ratings compare each player with their own ", ["expected win rate"], ", which is what their table sizes predict, rather than with the group’s overall win rate. The reason is that 3-player games are easier to win than 4-player games: someone who happens to sit at more small tables would get a friendlier comparison if everyone were held to the same group rate. Here, 1,000 means you win exactly as often as your own tables predict, and each percentage point above or below that is worth 20 points."]);
    para(["The ", ["Group average"], " option at the top swaps p back to the group’s overall win rate. That is how the spreadsheet’s Stats tab calculates Rating, so use it if you want the numbers to match the sheet. Everything else in the formula is identical."]);

    head("Expected win % and Luck");
    para([["Expected"], " is the win rate a player would have from table size alone. In a game with T players everyone has a 1-in-T chance: 25% at a 4-player table, 33% at a 3-player table, 20% at 5. A player’s expected win % is the average of 1 ÷ T across the games they played."]);
    para([["Luck"], " = win % − expected win %, in percentage points. Positive means winning more than the table sizes predict, negative means less. It isn’t a pure skill measure, since a hot streak shows up here too, but it removes the table-size effect."]);

    head("Periods, nights and the arrows");
    para(["The Period menu recalculates everything using only the games in that period, so a monthly rating starts fresh on the first of the month, with everyone back at the starting assumption. The ", ["arrows"], " next to each rating compare it with the rating after the previous game night. Someone who didn’t play the latest night can still move slightly, because the group’s win rate shifts a little with every game. ", ["Nemesis"], " and ", ["Lucky charm"], " in a player’s details need at least three shared games."]);
    para([["Active only"], " hides players who haven\u2019t played in the " + ACTIVE_DAYS + " days up to the most recent game. It changes who is listed, not the math: ratings and arrows still come from every game. Awards only consider the players shown, and the game log keeps its full history. The choice is remembered on your device."]);

    head("What the rating can’t tell you");
    list("ul", [
      ["It doesn’t know who you played. Beating a strong table counts the same as beating a weak one."],
      ["In the Group average view it doesn’t adjust for table size, so 3-player tables (easier to win) help a little. The default Table-adjusted view, and the Luck column, account for that."],
      ["Every game counts equally, whenever it was played, unless you narrow the Period."],
      ["A hot streak looks like skill until enough games dilute it."]
    ]);
    para([["Provisional"], " marks players with fewer than " + PROVISIONAL + " games, where the imaginary games still outweigh the real record. Ranking always follows the rating."]);
  }

  // ---------- render ----------
  function isActive(name) { return !CUTOFF || (LAST[name] || "") >= CUTOFF; }
  function isShown(p) { return !activeOnly || p.active; }

  function recompute() {
    M = compute(periodGames(), basis, ORDER);
    M.players.forEach(function (p) { p.active = isActive(p.name); });
    M.shown = M.players.filter(isShown);
    M.hidden = M.players.filter(function (p) { return !isShown(p); });
    M.shown.slice().sort(function (a, b) { return b.rating - a.rating || b.g - a.g; }).forEach(function (p, i) { p.shownRank = i + 1; });
  }

  function renderAll() {
    renderHeader(); renderToolbar(); renderFacts(); renderBoard(); renderLegend(); renderLog(); renderMatrix(); renderHow();
    renderTable();
    if (view === "chart") drawChart();
    $("#foot").textContent = "Ratings are recomputed from the full game log every time the page loads.";
    if (pendingScroll && openName) {
      var row = document.querySelector('tr.row[data-player="' + openName.replace(/"/g, '\\"') + '"]');
      if (row) row.scrollIntoView({ block: "center" });
      pendingScroll = false;
    }
  }

  function setData(data) {
    ALL = sortGames(data.games);
    ORDER = [];
    ALL.forEach(function (g) { g.players.forEach(function (n) { if (ORDER.indexOf(n) < 0) ORDER.push(n); }); });
    LAST = {}; ANCHOR = "";
    ALL.forEach(function (g) {
      if (g.date > ANCHOR) ANCHOR = g.date;
      g.players.forEach(function (n) { if (!LAST[n] || g.date > LAST[n]) LAST[n] = g.date; });
    });
    var anchorDay = parseIso(ANCHOR);
    if (anchorDay) { anchorDay.setDate(anchorDay.getDate() - ACTIVE_DAYS); CUTOFF = isoOf(anchorDay); } else CUTOFF = "";
    buildPeriods();
    recompute();
    if (openName && !(M.byName[openName] && isShown(M.byName[openName]))) openName = null;
    writeHash();
    renderAll();
  }

  // ---------- loading: cache, live sheet ----------
  function readCache() {
    try { var o = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (o && o.games && o.games.length) return o; } catch (e) {}
    return null;
  }
  function saveCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), games: d.games })); } catch (e) {} }

  function load() {
    if (!CFG.sheetCsvUrl || busy) return;
    busy = true; failed = false; renderStatus();
    fetch(CFG.sheetCsvUrl, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (text) {
        var d = parseLog(text);
        if (!d.games.length) throw new Error("No games in the sheet");
        src = "live"; stamp = new Date(); busy = false; failed = false; lastLoadMs = Date.now();
        saveCache(d); setData(d);
      })
      .catch(function (err) {
        busy = false; failed = true;
        if (window.console) console.warn("Live sheet unavailable:", err);
        renderStatus();
      });
  }

  // ---------- events ----------
  $("#period").addEventListener("change", function (e) { period = e.target.value; openName = null; showAllLog = false; recompute(); writeHash(); renderAll(); });
  function setBasis(b) { if (basis === b) return; basis = b; recompute(); writeHash(); renderAll(); }
  $("#bGroup").addEventListener("click", function () { setBasis("group"); });
  $("#bTable").addEventListener("click", function () { setBasis("table"); });
  function setActive(on) {
    if (activeOnly === on) return;
    activeOnly = on;
    try { if (on) localStorage.setItem(ACTIVE_KEY, "1"); else localStorage.removeItem(ACTIVE_KEY); } catch (e) {}
    recompute(); writeHash(); renderAll();
  }
  $("#aAll").addEventListener("click", function () { setActive(false); });
  $("#aActive").addEventListener("click", function () { setActive(true); });
  $("#lNights").addEventListener("click", function () { logView = "nights"; showAllLog = false; renderLog(); });
  $("#lGames").addEventListener("click", function () { logView = "games"; showAllLog = false; renderLog(); });
  $("#moreLog").addEventListener("click", function () { showAllLog = !showAllLog; renderLog(); });
  $("#vChart").addEventListener("click", function () { setView("chart"); });
  $("#vTable").addEventListener("click", function () { setView("table"); });

  document.addEventListener("pointerdown", function (e) { if (!e.target.closest || !e.target.closest("#chartwrap")) hideTip(); });
  var svgEl = $("#chart");
  svgEl.addEventListener("keydown", function (e) {
    if (!geo) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      kbIdx = kbIdx == null ? geo.N - 1 : Math.max(0, Math.min(geo.N - 1, kbIdx + (e.key === "ArrowRight" ? 1 : -1)));
      showAt(kbIdx);
    } else if (e.key === "Escape") { kbIdx = null; hideTip(); }
  });
  svgEl.addEventListener("blur", function () { kbIdx = null; hideTip(); });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (M && view === "chart") drawChart(); }, 80); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && CFG.sheetCsvUrl && !busy && Date.now() - lastLoadMs > REFRESH_AFTER_MS) load();
  });

  // ---------- boot ----------
  var hs = readHash();
  if (hs.period) period = hs.period;
  if (hs.rating === "group") basis = "group";
  try { if (hs.active === "1" || (hs.active == null && localStorage.getItem(ACTIVE_KEY) === "1")) activeOnly = true; } catch (e) { if (hs.active === "1") activeOnly = true; }
  if (hs.player) { openName = hs.player; pendingScroll = true; }

  var cached = CFG.sheetCsvUrl ? readCache() : null;
  if (cached) { src = "cached"; stamp = new Date(cached.t); setData({ games: cached.games }); }
  else { src = "snapshot"; setData(window.MAHJONG_SNAPSHOT || { games: [] }); }
  load();
})();

</script>
</body>
</html>
